# A TLS Secret: an SSL certificate + its private key, mounted as FILES.
#
# Unlike 12/13 (which use "stringData" = plain text), this one uses "data":
# every value MUST be base64-encoded. That's how Kubernetes itself stores and shows Secrets.
# Kubernetes decodes it again when it writes the files into the pod.
#
# Generated with:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=demo.local" -keyout tls.key -out tls.crt
#   kubectl create secret tls demo-tls -n demo --cert=tls.crt --key=tls.key --dry-run=client -o yaml
#
# Decode it yourself:
#   kubectl get secret demo-tls -n demo -o jsonpath='{.data.tls\.crt}' | base64 -d
#
# Self-signed throwaway demo key - never put a real private key in a file like this!
apiVersion: v1
kind: Secret
metadata:
  name: demo-tls
  namespace: demo
type: kubernetes.io/tls   # built-in type: Kubernetes checks that tls.crt and tls.key are present
data:
  tls.crt: 
  tls.key: 
