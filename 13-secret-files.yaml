# This Secret is mounted FILE BY FILE (subPath) by the "config-reader" pod:
#   key payment-api -> /etc/payment-api.key
#   key weather-api -> /etc/weather-api.key
# Compare with 14-secret-tls.yaml, which is mounted as a whole directory.
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: demo
type: Opaque
stringData:
  payment-api: "pk_demo_123456"
  weather-api: "wk_demo_abcdef"
