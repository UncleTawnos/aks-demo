# Secret = sensitive settings (passwords, tokens).
# This one is consumed as ENVIRONMENT VARIABLES by the "config-reader" pod.
#
# "stringData" lets us write plain text; Kubernetes stores it base64-encoded.
# Base64 is NOT encryption - never commit real secrets to git!
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
type: Opaque
stringData:
  DB_USER: "demo-user"
  DB_PASSWORD: "super-secret-password"
