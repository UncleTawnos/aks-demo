# A tiny pod that only prints its configuration, so we can SEE how
# ConfigMaps and Secrets arrive inside a container.
#   kubectl logs -n demo config-reader
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: demo
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          while true; do
            echo "--- environment variables ---"
            echo "APP_COLOR=$APP_COLOR  APP_MODE=$APP_MODE"
            echo "DB_USER=$DB_USER  DB_PASSWORD=$DB_PASSWORD"
            echo "--- single files mounted into /etc ---"
            for f in /etc/*.key; do echo "$f = $(cat $f)"; done
            echo "--- TLS files in /etc/tls (base64 already decoded) ---"
            for f in /etc/tls/*; do echo "$f: $(head -1 $f)"; done
            sleep 30
          done
      # ConfigMap as env: every key becomes an environment variable.
      # Secret as env: same idea, values come from the Secret.
      envFrom:
        - configMapRef:
            name: app-settings
        - secretRef:
            name: db-credentials
      volumeMounts:
        # Secret mounted FILE BY FILE: "subPath" picks ONE key from the volume
        # and mounts it as a single file at exactly "mountPath".
        # The rest of /etc (passwd, hosts, ...) stays visible. Mounting the whole
        # volume at /etc would hide everything else that was in /etc.
        # Catch: subPath files are NOT updated when the Secret changes (restart the pod).
        - name: api-keys
          mountPath: /etc/payment-api.key
          subPath: payment-api
          readOnly: true
        - name: api-keys
          mountPath: /etc/weather-api.key
          subPath: weather-api
          readOnly: true
        # Secret mounted as a DIRECTORY: every key becomes a file in /etc/tls
        # (tls.crt and tls.key). Files here DO update when the Secret changes.
        - name: tls
          mountPath: /etc/tls
          readOnly: true
  volumes:
    - name: api-keys
      secret:
        secretName: api-keys
    - name: tls
      secret:
        secretName: demo-tls
